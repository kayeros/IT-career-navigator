<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Карьерный навигатор IT: выберите профессию, оцените навыки и получите план до первой работы.">
  <title>Карьерный навигатор IT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101522'/%3E%3Cg fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 10l6 6-6 6' stroke='%237090FF' stroke-width='3.4'/%3E%3Cpath d='M18.5 22h5' stroke='%23fff' stroke-width='3.4'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <style>
/* Карьерный навигатор IT — стили.
   Сетка: шапка, колонка контента до 1120px, карта тем с боковой панелью.
   Синий — навигация и действия, янтарный — «вы здесь». Цвета задаются переменными ниже. */
:root{
  --bg:#E8ECF3; --surface:#FFFFFF; --sunk:#DDE3EC; --ink:#0D1220; --muted:#465065; --line:#C8D0DD;
  --accent:#2446C8; --accent-ink:#FFFFFF; --accent-soft:#DCE4FB;
  --amber:#D98A07; --amber-soft:#FCF1DC; --good:#1D8657; --good-soft:#E1F3EA; --bad:#C23E2C; --bad-soft:#FBE7E3; --gap:#D4952F; --gap-soft:#FBF0DC;
  --shadow:0 1px 2px rgba(13,18,32,.08),0 8px 24px rgba(13,18,32,.08);
  --spine:#2B78E4; --rec:#7C3AED; --alt:#16A34A; --opt:#9CA3AF; --rm-main:#FCE38A; --rm-main-line:#E6C65A; --rm-main-ink:#1F1A08;
  --tile:var(--surface); --card-sh:0 1px 2px rgba(13,18,32,.05),0 4px 16px rgba(13,18,32,.05);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E121A; --surface:#161C27; --sunk:#1C2330; --ink:#E6E9F0; --muted:#97A0B2; --line:#283041;
  --accent:#7090FF; --accent-ink:#0B1020; --spine:#5B9BF0; --rec:#A78BFA; --alt:#4ADE80; --opt:#6B7280; --accent-soft:#1D2744; --rm-main:#EBCB62; --rm-main-line:#EBCB62; --rm-main-ink:#1A1404; --rm-main:#EBCB62; --rm-main-line:#EBCB62; --rm-main-ink:#1A1404;
  --amber:#F0B13A; --amber-soft:#33280F; --good:#4CC28E; --good-soft:#12291F; --bad:#F06D5B; --bad-soft:#331815; --gap:#E3B866; --gap-soft:#2E2716;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --tile:var(--bg); --card-sh:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E121A; --surface:#161C27; --sunk:#1C2330; --ink:#E6E9F0; --muted:#97A0B2; --line:#283041;
  --accent:#7090FF; --accent-ink:#0B1020; --spine:#5B9BF0; --rec:#A78BFA; --alt:#4ADE80; --opt:#6B7280; --accent-soft:#1D2744;
  --amber:#F0B13A; --amber-soft:#33280F; --good:#4CC28E; --good-soft:#12291F; --bad:#F06D5B; --bad-soft:#331815; --gap:#E3B866; --gap-soft:#2E2716;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --tile:var(--bg); --card-sh:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(26px,3.4vw,40px)} h2{font-size:22px} h3{font-size:16px}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:62px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--ink);text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.logo svg{flex:none}
.logo{gap:12px;font-size:17px;letter-spacing:-.01em}
.logo-mark{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#5B86FF,#2A4FD4 60%,#5B3FD0);box-shadow:0 6px 16px -6px rgba(42,79,212,.7),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .2s}
.logo:hover .logo-mark{transform:rotate(-6deg) scale(1.05)}
.logo-t b{color:var(--accent);font-weight:700}
.logo-mark svg{width:24px;height:24px}
.logo-mark.lm-plain{background:none;box-shadow:none;border:2px solid var(--accent)}
@media (max-width:520px){.logo{font-size:15px}.logo-mark{width:32px;height:32px;border-radius:9px}}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.nav button:hover{color:var(--ink);background:var(--sunk)}
.nav button.on{color:var(--ink);background:var(--sunk)}
.nav .cta{background:var(--accent);color:var(--accent-ink)}
.nav .cta:hover{background:var(--accent);color:var(--accent-ink);filter:brightness(1.08)}
.nav .theme{display:grid;place-items:center;width:38px;padding:8px 0}
.nav .theme svg{display:block}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;border:1px solid transparent;cursor:pointer;font-weight:600;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.link{background:none;padding:0;color:var(--accent);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:8px}

main{padding-block:36px 56px;min-height:60vh}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.page-head p{margin-top:8px;max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}

/* формы */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
textarea{min-height:96px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;accent-color:var(--accent)}
.err{color:var(--bad);font-size:13px}
[aria-invalid]{border-color:var(--bad)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--muted)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{accent-color:var(--accent)}

/* метки и значки */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.gap{background:var(--gap-soft);color:var(--gap)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.stub-note{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;display:inline-block}
.btn.lg{padding:14px 22px;font-size:16px;border-radius:12px}
.btn .arr{transition:transform .15s}
.btn:hover .arr{transform:translateX(3px)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.section{margin-top:72px}
@media (max-width:960px){ .steps{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:520px){ .steps{grid-template-columns:minmax(0,1fr)} }

/* главная, исходный вариант */
.o-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:40px;align-items:stretch;padding-block:8px 8px}
.o-copy{display:flex;flex-direction:column}
.o-copy > .row{margin-bottom:32px}
.o-hero p.lead{font-size:18px;color:var(--muted);margin-top:16px;max-width:52ch}
.o-copy > .row{margin-top:28px}
.o-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:auto 0 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.o-facts > div{padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.o-facts > div + div{border-left:1px solid var(--line)}
.o-facts dt{font-family:var(--f-display);font-size:24px;font-weight:600;color:var(--accent);letter-spacing:-.01em}
.o-facts dd{margin:0;font-size:13px;color:var(--muted)}
.o-contact{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.o-contact-info{display:flex;flex-direction:column;gap:22px;padding:28px;border-right:1px solid var(--line)}
.o-contacts{margin:0;display:flex;flex-direction:column}
.o-contacts > div{display:flex;justify-content:space-between;gap:12px;padding-block:10px;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.o-contacts dt{color:var(--muted)}
.o-contacts dd{margin:0;font-weight:500}
.o-form{padding:28px}
.o-social{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto}
.o-form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.o-form textarea{min-height:84px}
@media (max-width:900px){
  .o-hero,.o-contact{grid-template-columns:minmax(0,1fr)}
  .o-contact-info{border-right:0;border-bottom:1px solid var(--line)}
}
@media (max-width:520px){ .o-form-row,.o-facts{grid-template-columns:minmax(0,1fr)} .o-facts > div + div{border-left:0;border-top:1px solid var(--line)} }

.o-how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.o-how-step{display:flex;flex-direction:column;gap:10px;align-items:stretch;padding:24px;border:0;background:none;text-align:left;cursor:pointer;color:inherit;transition:background .15s}
.o-how-step + .o-how-step{border-left:1px solid var(--line)}
.o-how-step:hover{background:var(--sunk)}
.o-how-n{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.04em}
.o-how-step p{color:var(--muted);font-size:14px}
.o-how-prev{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:64px;display:flex;flex-direction:column;justify-content:center}
.o-how-go{color:var(--accent);font-weight:600;font-size:14px}
@media (max-width:900px){ .o-how{grid-template-columns:repeat(2,minmax(0,1fr))} .o-how-step:nth-child(3){border-left:0} .o-how-step:nth-child(n+3){border-top:1px solid var(--line)} }
@media (max-width:520px){ .o-how{grid-template-columns:minmax(0,1fr)} .o-how-step + .o-how-step{border-left:0;border-top:1px solid var(--line)} }
/* отчёт о разрыве */
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.ring{--p:46;width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring b{width:100px;height:100px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:28px;font-weight:600}
.skills{display:flex;flex-direction:column}
.skill{display:grid;grid-template-columns:minmax(0,1fr) 140px 48px;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.skill:last-child{border-bottom:0}
.skill .pct{text-align:right;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.skill.have .meter i{background:var(--good)}
.skill.miss .meter i{background:var(--accent)}
.locked{position:relative}
.locked .blur{filter:blur(5px);pointer-events:none;user-select:none;opacity:.7}
.locked .over{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.locked .over > div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 22px;box-shadow:var(--shadow);max-width:320px}

/* каталог */
.pcard{display:flex;flex-direction:column;gap:14px;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;cursor:pointer;position:relative}
.pcard:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.pcard.stub{cursor:default;opacity:.62}
.pcard.stub:hover{border-color:var(--line);box-shadow:none}
.pcard .top-r{display:flex;gap:6px;flex-wrap:wrap;min-height:22px}
.pc-stats{margin:auto 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:baseline;border-top:1px solid var(--line);padding-top:14px}
.pc-stats dt{font-size:13.5px;color:var(--muted)}
.pc-stats dd{margin:0;text-align:right;font-family:var(--f-mono);font-size:15px;font-weight:600;white-space:nowrap}
.pc-stats small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted)}
.pc-go{font-size:14px;font-weight:600;color:var(--accent)}
.rm-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.rm{position:relative;margin:0 auto}
.rm svg{position:absolute;inset:0;pointer-events:none}
.node{position:absolute;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;border-radius:10px;cursor:pointer;font-weight:500;text-align:center;line-height:1.2;font-size:13.5px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.06);transition:border-color .15s,box-shadow .15s,transform .15s}
.node:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 14px rgba(15,23,42,.10)}
.node.main{background:var(--rm-main);border-color:var(--rm-main-line);color:var(--rm-main-ink);font-size:15px;font-weight:600}
.node.main:hover{border-color:var(--rm-main-ink)}
.node.proj{background:var(--accent-soft);border:1.5px dashed var(--accent);color:var(--ink);font-weight:600}
.node.optn{border-style:dashed;color:var(--muted);background:transparent;box-shadow:none}
.node.sel{box-shadow:0 0 0 3px var(--accent)}
.node.done{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.node.known{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.node.current{background:var(--amber);border-color:var(--amber);color:#1A1200;font-weight:600;box-shadow:0 0 0 4px var(--amber-soft)}
.node.skip{background:transparent;border-style:dashed;border-color:var(--line);color:var(--muted);box-shadow:none}
.mk{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;border:2px solid var(--surface)}
.mk svg{display:block}
.mk.static{position:static;display:inline-grid;width:18px;height:18px;border:0;vertical-align:-4px;margin-right:6px}
.mk.rec{background:var(--rec)} .mk.alt{background:var(--alt)} .mk.opt{background:var(--surface);color:var(--muted);border-color:var(--bg);box-shadow:inset 0 0 0 1.5px var(--muted)}
.mk.opt.static{box-shadow:inset 0 0 0 1.5px var(--muted)}
.legend .lg-opt{width:22px;border:1.5px dashed var(--muted);vertical-align:-3px;margin-right:6px}
.rm-bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.res{display:flex;flex-direction:column;gap:6px}
.res a{display:flex;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:9px;color:var(--ink);text-decoration:none;font-size:14px;flex-wrap:wrap}
.res a:hover{border-color:var(--accent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend > span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1.5px solid}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:40;padding:28px 24px calc(84px + env(safe-area-inset-bottom,0px));overflow:auto;display:flex;flex-direction:column;gap:18px;transform:translateX(100%);transition:transform .22s ease}
.drawer.open{transform:none}
.drawer .x{position:absolute;top:16px;right:16px;background:var(--sunk);border:0;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px}
.drawer ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;border-radius:12px;margin-bottom:20px}
.banner.frozen{background:var(--sunk);border:1px dashed var(--muted)}
.banner.info{background:var(--accent-soft)}

/* тест */
.quiz{max-width:640px;margin:0 auto}
.progress{display:flex;gap:6px;margin-bottom:24px}
.progress i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.progress i.on{background:var(--accent)}

/* план */
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:14px;align-items:start;padding-block:14px;border-bottom:1px solid var(--line)}
.tl:last-child{border-bottom:0}
.tl .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.tl.cur .dot{background:var(--amber);color:#1A1200}
.tl.proj .dot{background:var(--accent-soft);color:var(--accent)}
.tl .h{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.warn{background:var(--amber-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14px;display:flex;gap:10px}
.warn b{color:var(--amber)}
.stat{display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--f-display);font-size:26px;font-weight:600}
.stat span{font-size:13px;color:var(--muted)}

/* подписка */
.tier{display:flex;flex-direction:column;gap:18px}
.tier.pro{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tier .price{font-family:var(--f-display);font-size:34px;font-weight:600}
.tier ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.tier li{display:flex;gap:10px}
.tier li::before{content:"✓";color:var(--good);font-weight:700}
.tier li.no{color:var(--muted)}
.tier li.no::before{content:"—";color:var(--muted)}

/* вход и регистрация */

// иначе введённый в поле код выполнится на странице (XSS).
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

// Проверка полей формы. rules: [id поля, проверка значения, текст ошибки].
// Ошибка показывается прямо под полем, первое неверное поле получает фокус.
function validate(form, rules){
  form.querySelectorAll('.err[data-for]').forEach(e => e.remove());
  let first = null;
  for (const [id, test, msg] of rules){
    const el = document.getElementById(id);
    const bad = !test(el.value.trim());
    el.toggleAttribute('aria-invalid', bad);
    if (bad){
      el.insertAdjacentHTML('afterend', `<span class="err" data-for="${id}">${msg}</span>`);
      first = first || el;
    }
  }
  if (first) first.focus();
  return !first;
}

const PAGE_TITLES = {
  home: 'Главная', auth: 'Вход / регистрация', reset: 'Восстановление пароля',
  onboarding: 'Онбординг', quiz: 'Профориентация', catalog: 'Каталог профессий',

  about: 'О проекте', notfound: 'Ошибка 404',
};

// Страницы, на которые без входа не пускают.
const NEED_AUTH = ['onboarding', 'quiz', 'assess', 'report', 'plan', 'cabinet', 'profile'];

let current = 'home';

// Охранник: решает, можно ли открыть страницу, и если нельзя, куда отправить вместо неё.
function guard(page) {
  if (page === 'offer') return 'terms';      // старые адреса документов
  if (page === 'cookies') return 'policy';
  if (!PAGE_TITLES[page]) return 'notfound';
  if (NEED_AUTH.includes(page) && !state.auth) {
    state.returnTo = page;                   // после входа вернём сюда
    return 'auth';
  }
  if ((page === 'auth' || page === 'reset') && state.auth) return 'cabinet';
  if (page === 'plan' && role() === 'user') return 'pricing';
  return page;
}

// Переход на страницу. Меняет адрес, а перерисовку запускает обработчик hashchange.
function go(page, opts = {}) {
  if (opts.authTab) state.authTab = opts.authTab;
  if (page === 'auth' && current !== 'auth' && current !== 'reset') state.returnTo = current;
  const target = guard(page);
  if (target === 'auth' && page !== 'auth' && !state.returnTo) state.returnTo = page;
  if ('#' + target === location.hash) render();
  else location.hash = target;
}

function roadmapLayout(){
  const W=960, MW=230, MX=(W-MW)/2, MH=50, SW=210, SX_L=24, SX_R=W-24-SW, SH=40, SG=10, PAD=40;
  let y=PAD; const nodes=[], lines=[];
  let prev=null;
  ROADMAP.forEach(m=>{
    const subs=m.subs||[]; const half=Math.ceil(subs.length/2);
    const L=subs.slice(0,half), R=subs.slice(half);
    const sideH = k => k? k*SH+(k-1)*SG : 0;
    const rowH = Math.max(MH, sideH(L.length), sideH(R.length));
    const my = y + (rowH-MH)/2;
    nodes.push({id:m.id,x:MX,y:my,w:MW,h:MH,kind:m.proj?'proj':'main'});
    if (prev) lines.push(`<path d="M${W/2} ${prev.y+prev.h} L${W/2} ${my}" stroke="var(--spine)" stroke-width="3" fill="none"/>`);
    prev={y:my,h:MH};
    [[L,SX_L,'L'],[R,SX_R,'R']].forEach(([arr,sx,side])=>{
      let sy = y + (rowH-sideH(arr.length))/2;
      arr.forEach(s=>{
        nodes.push({id:s[0],x:sx,y:sy,w:SW,h:SH,kind:'sub'});
        const x1 = side==='L'? MX : MX+MW, y1=my+MH/2, x2 = side==='L'? sx+SW : sx, y2=sy+SH/2, cx=(x1+x2)/2;
        lines.push(`<path d="M${x1} ${y1} C${cx} ${y1} ${cx} ${y2} ${x2} ${y2}" stroke="var(--spine)" stroke-width="1.6" stroke-dasharray="1 5" stroke-linecap="round" fill="none"/>`);
        sy += SH+SG;
      });
    });
    y += rowH + 34;
  });
  return {W,H:y+PAD-34,nodes,lines};
}

}

function roadmapProgress(){

}

// и заново рисует шапку, футер и плашку cookie (они зависят от роли).
function render() {
  const page = location.hash.replace('#', '') || 'home';

  if (target !== page) { location.hash = target; return; }
  current = target;
  if (target !== 'roadmap') closeDrawer();
  document.getElementById('app').innerHTML = pages[target]();
  document.title = 'Карьерный навигатор IT';
  topbar();
  footer();
  cookieBar();
  window.scrollTo(0, 0);
  if (target === 'roadmap' && state.openTopic) openDrawer(state.openTopic);
}

/* ---------- реакции на клики и формы ---------- */
// После входа возвращаем туда, куда человек шёл до входа.
function afterLogin(){
  const to = state.returnTo || 'home'; state.returnTo=null; go(to);
}
// После оплаты (в прототипе она имитируется) ведём к следующему шагу.
function afterPurchase(){
  state.sub='active';
  toast('Оплата прошла (имитация). Подписка активна.');
  if (state.profession && state.assessed) go('plan');
  else if (state.profession) go('assess');
  else go('catalog');
}
// Один общий обработчик кликов. Кнопка с data-go просто ведёт на страницу,
// кнопка с data-act запускает действие: ищите его ниже как case 'имя'.
document.addEventListener('click',e=>{
  const el = e.target.closest('[data-go],[data-act]'); if(!el) return;
  const act = el.dataset.act;
  if (el.dataset.go){ e.preventDefault(); go(el.dataset.go,{authTab:el.dataset.tab}); return; }
  switch(act){
    case 'noop': e.preventDefault(); toast('В прототипе ссылки на материалы — заглушки'); break;
    case 'theme': { const t=isDark()?'light':'dark'; document.documentElement.dataset.theme=t; try{localStorage.setItem('nav-theme',t)}catch(e){} topbar(); break; }
    case 'menu': { const bar=document.getElementById('topbar'); const open=bar.classList.toggle('menu-open'); el.setAttribute('aria-expanded',open); break; }
    case 'cookieOk': state.cookieOk=true; try{localStorage.setItem('nav-cookie','1')}catch(e){} cookieBar(); break;
    case 'start':
      if (!state.auth) go('auth',{authTab:'register'});
      else go(state.onboarded?'cabinet':'onboarding'); break;
    case 'tab': state.authTab=el.dataset.tab; render(); break;
    case 'quizAns': { state.quizAns=state.quizAns||[]; state.quizAns[state.quizStep]=+el.dataset.v; render(); setTimeout(()=>{state.quizStep++; if (state.quizStep>=QUIZ.length) state.quizDone=true; render(); window.scrollTo(0,0)},220); break; }
    case 'quizRestart': state.quizStep=0; state.quizAns=[]; state.quizDone=false; render(); break;
    case 'quizBack': state.quizStep=Math.max(0,state.quizStep-1); render(); break;
    case 'allProf': go('catalog'); break;
    case 'openProf': {
      const p = PROFESSIONS.find(x=>x.id===el.dataset.id);
      if (!p.live){ toast(state.auth?'Сообщим о запуске «'+p.t+'» на '+state.email:'Сообщим о запуске. В прототипе открывается только Frontend'); break; }
      state.profession='frontend';
      if (role()==='sub' && !state.assessed) go('assess'); else go('roadmap');
      break; }
    case 'topic': openDrawer(el.dataset.id); break;
    case 'toQuiz': state.quizStep=0; state.quizAns=[]; state.pickedProf='unknown'; go('quiz'); break;
    case 'pickProf': {
      const id=el.dataset.id; state.pickedProf=id;
      if (id!=='unknown' && !PROFESSIONS.find(p=>p.id===id).live){ toast('В прототипе открывается только Frontend, остальные — заглушки'); }
      if (!state.auth) go('auth',{authTab:'register'}); else go(state.onboarded?(id==='unknown'?'quiz':'roadmap'):'onboarding');
      break; }
    case 'demoGo': go(state.assessed?'report':'assess'); break;
    case 'catFilter': state.catFilter=el.dataset.v; render(); applyCatSearch(); break;
    case 'bug': document.getElementById('bugBox').innerHTML=`<div class="stack gap-8"><label for="bugTxt" class="fs-13 fw-600">Что не так в теме?</label><textarea id="bugTxt" class="ta-short" placeholder="Например: ссылка не открывается"></textarea><div><button class="btn ghost sm" data-act="bugSend">Отправить</button></div></div>`; break;
    case 'bugSend': document.getElementById('bugBox').innerHTML='<span class="chip good">Спасибо, передали команде</span>'; break;
    case 'closeDrawer': closeDrawer(); break;
    case 'openTopic': state.openTopic=el.dataset.id; go('roadmap'); break;
    case 'learn': {
      if (!state.auth){ state.returnTo='roadmap'; go('auth',{authTab:'login'}); break; }
      const id=el.dataset.id;
      if (roadmapMode()==='personal' && PERSONAL.known.includes(id)){ toast('Тема отмечена как известная по оценке навыков'); break; }
      state.learned.has(id)?state.learned.delete(id):state.learned.add(id);
      if (roadmapMode()==='personal' && state.learned.has(PERSONAL.current)){ const nx=PLAN.find(p=>TOPICS[p[0]]&&!state.learned.has(p[0])&&!PERSONAL.known.includes(p[0])); if(nx){ PERSONAL.current=nx[0]; toast('Следующий шаг: '+nx[1]); } }
      const keep=id; render(); openDrawer(keep); break; }
    case 'toAssess': go('assess'); break;
    case 'assessNext':
      if (state.assessStep < ASSESS.length-1){ state.assessStep++; render(); }
      else { state.assessed=true; state.profession='frontend'; state.assessStep=0; go('report'); }
      break;
    case 'assessBack': state.assessStep=Math.max(0,state.assessStep-1); render(); break;
    case 'buy':
      if (!state.auth){ state.returnTo='pricing'; go('auth',{authTab:'login'}); break; }
      afterPurchase(); break;
    case 'askCancel':
      document.getElementById('cancelBox').innerHTML = `<div class="stack gap-10"><span class="fs-14">Отменить подписку? План и карта станут доступны только для чтения, прогресс сохранится.</span><div class="row"><button class="btn primary sm" data-act="doCancel">Да, отменить</button><button class="btn ghost sm" data-act="keepSub">Оставить</button></div></div>`; break;
    case 'doCancel': state.sub='expired'; toast('Подписка отменена'); render(); break;
    case 'keepSub': render(); break;
    case 'logout': state.auth=false; state.returnTo=null; toast('Вы вышли из аккаунта'); go('home'); break;
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.getAttribute && e.target.getAttribute('role')==='button'){ e.target.click(); } if(e.key==='Escape'){ closeDrawer(); } });
function applyCatSearch(){ const q=(state.catQuery||'').trim().toLowerCase(); document.querySelectorAll('#catGrid .pcard').forEach(c=>c.hidden=!!q&&!c.dataset.name.includes(q)); }
document.addEventListener('input',e=>{ if(e.target.id==='catSearch'){ state.catQuery=e.target.value; applyCatSearch(); } if(e.target.id==='obHours'){ document.getElementById('obHoursV').textContent=e.target.value; } });
// Формы. Каждая сначала проверяет поля через validate(), потом меняет state.
document.addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target;
  if (f.id==='fbForm'){
    if (!validate(f,[['fbName',v=>v.length>0,'Напишите, как к вам обращаться'],['fbMail',isEmail,'Проверьте адрес почты'],['fbMsg',v=>v.length>=5,'Напишите вопрос']])) return;
    if (!document.getElementById('fbOk').checked){ document.getElementById('fbErr').hidden=false; return; }
    f.innerHTML = `<div class="stack sent-box"><span class="chip good">Отправлено</span><h2>Спасибо, мы ответим</h2><p class="muted">Ответ придёт на указанную почту.</p></div>`;
  }
  if (f.id==='regForm'){
    if (!validate(f,[['rLogin',v=>/^[a-zA-Z0-9_.-]{3,30}$/.test(v),'Логин: от 3 до 30 латинских букв, цифр, точек или дефисов'],['rMail',isEmail,'Проверьте адрес почты'],['rPass',v=>v.length>=8,'Пароль должен быть не короче 8 символов'],['rTel',v=>v==='' || v.replace(/\D/g,'').length>=10,'Проверьте номер телефона']])) return;
    if (!document.getElementById('rOk').checked){ document.getElementById('rErr').hidden=false; return; }
    state.auth=true; state.onboarded=false; state.returnTo=null; toast('Аккаунт создан'); go('onboarding');
  }
  if (f.id==='loginForm'){ if (!validate(f,[['lMail',isEmail,'Проверьте адрес почты'],['lPass',v=>v.length>0,'Введите пароль']])) return; state.auth=true; toast('Вы вошли'); afterLogin(); }
  if (f.id==='resetForm'){ if (!validate(f,[['rsMail',isEmail,'Проверьте адрес почты']])) return; document.getElementById('rsDone').hidden=false; }
  if (f.id==='onbForm'){
    const st=f.querySelector('input[name=st]:checked'); if(st) state.status=st.value;
    state.hours=+document.getElementById('obHours').value; state.deadline=document.getElementById('obDl').value;
    state.onboarded=true; const p=document.getElementById('obProf').value;
    if (p==='unknown'){ state.quizStep=0; go('quiz'); }
    else { if(p!=='frontend') toast('В прототипе открывается карточка Frontend-разработчика'); state.profession='frontend'; go('roadmap'); }
  }
  if (f.id==='profForm'){
    if (!validate(f,[['pName',v=>v.length>0 && v.length<=60,'Укажите имя, до 60 символов'],['pMail',isEmail,'Проверьте адрес почты'],['pHours',v=>/^\d+$/.test(v) && +v>=1 && +v<=80,'Часов в неделю: от 1 до 80']])) return;
    state.name=document.getElementById('pName').value||state.name; state.email=document.getElementById('pMail').value||state.email;
    state.status=document.getElementById('pStatus').value; state.hours=Math.max(1,parseInt(document.getElementById('pHours').value)||state.hours);
    state.deadline=document.getElementById('pDl').value; toast('Сохранено. План пересчитан.');
  }
  if (f.id==='pwForm'){ if (!validate(f,[['pw1',v=>v.length>=8,'Пароль должен быть не короче 8 символов'],['pw2',v=>v===document.getElementById('pw1').value.trim(),'Пароли не совпадают']])) return; toast('Пароль изменён'); f.reset(); }
});

render();

// параллакс картинки на главной
document.addEventListener('mousemove',e=>{const a=document.querySelector('.o-art.iso-art');if(!a)return;const r=a.getBoundingClientRect();
  const inside=e.clientX>r.left-200&&e.clientX<r.right+200&&e.clientY>r.top-200&&e.clientY<r.bottom+200;
  const mx=inside?Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width/2))/(r.width/2))):0, my=inside?Math.max(-1,Math.min(1,(e.clientY-(r.top+r.height/2))/(r.height/2))):0;
  a.style.setProperty('--mx',mx.toFixed(3));a.style.setProperty('--my',my.toFixed(3));});

</script>
</body>
</html>
