[project]
name = "collector"
version = "0.1.0"
description = "Сбор и анализ вакансий: загрузка, поиск навыков, веса навыков"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
