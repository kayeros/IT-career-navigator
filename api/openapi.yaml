openapi: 3.1.0
info:
  title: Карьерный навигатор IT — API
  version: 0.1.0
  description: |
    Контракт между backend и фронтендом. Источник истины: сначала меняем спецификацию, потом код.

    Срез 0 (демо трекеру): аккаунт, каталог, карточка профессии, «Изучено», % соответствия.

    **Авторизация** — cookie-сессия `session` (httpOnly, SameSite=Lax, Secure вне локальной среды),
    срок 30 дней. Фронтенд отправляет запросы с `credentials: 'include'` и токен не читает.

    **Ошибки** — всегда в формате `{"error": {"code": "...", "message": "..."}}`.
    Логика ветвится по `code`, `message` можно показать пользователю.
servers:
  - url: /api/v1

tags:
  - name: auth
    description: Регистрация, вход, выход
  - name: catalog
    description: Каталог и карточка профессии
  - name: progress
    description: Отметка «Изучено»
  - name: match
    description: Процент соответствия вакансиям
  - name: onboarding
    description: Онбординг и профиль
  - name: assessment
    description: Оценка навыков
  - name: plan
    description: План «что учить дальше»
  - name: admin
    description: Админка контента (только роль admin)

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Регистрация
      description: |
        Создаёт пользователя, записывает согласие на обработку ПД и сразу выполняет вход (ставит cookie).
        Ссылка подтверждения почты пока пишется в журнал сервера; вход без подтверждения разрешён.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: Пользователь создан, сессия открыта
          headers:
            Set-Cookie: {$ref: '#/components/headers/SessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409':
          description: 'Почта уже зарегистрирована (`email_taken`)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /auth/login:
    post:
      tags: [auth]
      summary: Вход
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Вход выполнен
          headers:
            Set-Cookie: {$ref: '#/components/headers/SessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401':
          description: 'Неверная почта или пароль (`invalid_credentials`)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: 'Слишком много попыток входа (`too_many_attempts`), заголовок Retry-After — через сколько секунд повторить'
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /auth/logout:
    post:
      tags: [auth]
      summary: Выход
      description: Закрывает текущую сессию и стирает cookie. Без сессии тоже отвечает 204.
      operationId: logout
      security: []
      responses:
        '204':
          description: Сессия закрыта

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Подтвердить почту по ссылке из письма
      description: |
        Токен приходит в ссылке `/verify-email?token=...` (пока письма пишутся в журнал сервера).
        Токен одноразовый, действует 48 часов.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenRequest'}
      responses:
        '204':
          description: Почта подтверждена
        '400':
          description: 'Ссылка неверная, устарела или уже использована (`invalid_token`)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /auth/verify-email/resend:
    post:
      tags: [auth]
      summary: Отправить письмо подтверждения ещё раз
      description: Не чаще раза в 60 секунд. Предыдущие ссылки перестают действовать.
      operationId: resendVerification
      security: [{session: []}]
      responses:
        '204':
          description: Письмо отправлено
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: 'Почта уже подтверждена (`already_verified`)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: 'Слишком часто (`too_many_requests`), заголовок Retry-After — через сколько секунд можно снова'
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /auth/password-reset:
    post:
      tags: [auth]
      summary: Запросить ссылку для смены пароля
      description: |
        Всегда отвечает 204, даже если почты нет в базе: так нельзя узнать, зарегистрирован ли человек.
        Ссылка `/reset-password?token=...` действует 1 час; на одну почту — не чаще раза в 60 секунд.
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '204':
          description: Если почта зарегистрирована, письмо отправлено
        '400': {$ref: '#/components/responses/ValidationError'}

  /auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: Задать новый пароль по ссылке из письма
      description: Токен одноразовый. После смены пароля все сессии пользователя закрываются — нужно войти заново.
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string, minLength: 8, maxLength: 128}
      responses:
        '204':
          description: Пароль изменён
        '400':
          description: 'Ошибка в пароле (`validation_error`) или ссылка неверная / устарела (`invalid_token`)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /me:
    get:
      tags: [auth]
      summary: Текущий пользователь
      operationId: getMe
      security: [{session: []}]
      responses:
        '200':
          description: Пользователь вошёл
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /professions:
    get:
      tags: [catalog]
      summary: Каталог профессий
      description: Профессии со статусами `available` и `soon` (скрытые не возвращаются), по порядку показа.
      operationId: listProfessions
      security: []
      responses:
        '200':
          description: Список профессий
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ProfessionSummary'}

  /professions/{slug}:
    get:
      tags: [catalog]
      summary: Карточка профессии с roadmap
      description: |
        Блоки → темы → материалы (только одобренные). Для вошедшего пользователя у тем заполнено `studied`,
        а в `progress` — сколько тем изучено. Для гостя `studied` = false, `progress` = null.
      operationId: getProfession
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Карточка профессии
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfessionDetail'}
        '404': {$ref: '#/components/responses/NotFound'}

  /topics/{id}/progress:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64}
    put:
      tags: [progress]
      summary: Отметить тему изученной
      description: Повторная отметка ничего не меняет. «Изучено» общее для всех профессий, где есть эта тема.
      operationId: markTopicStudied
      security: [{session: []}]
      responses:
        '204':
          description: Тема отмечена
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [progress]
      summary: Снять отметку «Изучено»
      operationId: unmarkTopicStudied
      security: [{session: []}]
      responses:
        '204':
          description: Отметка снята (или её не было)
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /professions/{slug}/match:
    get:
      tags: [match]
      summary: Процент соответствия вакансиям
      description: |
        Считается по последнему опубликованному снимку весов навыков профессии:
        % = Σ(вес × уровень) / Σ весов ключевых навыков × 100.

        Уровень навыка на срезе 0 — из «Изучено»: изучены все темы, закрывающие навык → 1;
        часть → 0,5; ни одной → 0.

        Если снимка весов ещё нет — `snapshot` = null, `percent` = null, списки пустые.
        `preliminary` = true, если в снимке меньше 200 вакансий (исключение для MVP).
      operationId: getMatch
      security: [{session: []}]
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Результат
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Match'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /me/profile:
    get:
      tags: [onboarding]
      summary: Профиль и ответы онбординга
      operationId: getProfile
      security: [{session: []}]
      responses:
        '200':
          description: Профиль (поля null, пока онбординг не пройден)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    put:
      tags: [onboarding]
      summary: Сохранить ответы онбординга
      description: |
        Передаются только изменяемые поля. `complete_onboarding: true` отмечает онбординг пройденным.
        Выбор профессии в онбординге не хранится — фронтенд сразу ведёт на её карточку или в профориентацию.
      operationId: updateProfile
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileInput'}
      responses:
        '200':
          description: Сохранено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /professions/{slug}/assessments:
    post:
      tags: [assessment]
      summary: Начать или продолжить оценку навыков
      description: |
        Если есть незавершённая оценка по профессии — возвращает её (200), иначе создаёт новую (201).
        Повторная оценка — не раньше чем через 7 дней после прошлой (`too_soon`).
      operationId: startAssessment
      security: [{session: []}]
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Незавершённая оценка
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Assessment'}
        '201':
          description: Новая оценка
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Assessment'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 'Повторная оценка раньше чем через 7 дней (`too_soon`); в message — когда можно'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /assessments/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    get:
      tags: [assessment]
      summary: Оценка навыков с вопросами и ответами
      operationId: getAssessment
      security: [{session: []}]
      responses:
        '200':
          description: Оценка
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Assessment'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /assessments/{id}/answers/{skill_id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      - {name: skill_id, in: path, required: true, schema: {type: integer, format: int64}}
    put:
      tags: [assessment]
      summary: Ответить по навыку
      description: |
        Уровень: «не знаю» — 0, «базово» — 0,5, «уверенно» — 1, если проверочный вопрос решён верно, иначе 0,5.
        Для «уверенно» нужен `check_option` — номер выбранного варианта (с 0). Проверочный вопрос
        засчитывается один раз: повторный ответ на него результат не меняет.
      operationId: answerAssessment
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnswerInput'}
      responses:
        '200':
          description: Ответ сохранён
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssessmentSkill'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 'Оценка уже завершена (`completed`)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /assessments/{id}/complete:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    post:
      tags: [assessment]
      summary: Завершить оценку и получить краткий отчёт
      description: Нужны ответы по всем навыкам. Уровни навыков сохраняются и действуют во всех профессиях.
      operationId: completeAssessment
      security: [{session: []}]
      responses:
        '200':
          description: Краткий отчёт о разрыве
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Report'}
        '400':
          description: 'Ответили не на все навыки (`validation_error`)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 'Оценка уже завершена (`completed`)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /professions/{slug}/report:
    get:
      tags: [match]
      summary: Краткий отчёт о разрыве
      description: |
        Считается на лету из оценки, «Изучено» и последнего снимка весов (не хранится).
        Краткий: % соответствия, сколько навыков есть / частично / не хватает и топ-3 пробела.
        Полный отчёт — по подписке (позже).
      operationId: getReport
      security: [{session: []}]
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Отчёт
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Report'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /professions/{slug}/plan:
    get:
      tags: [plan]
      summary: Текущий план «что учить дальше»
      description: Отметки «Изучено», прогресс и текущий шаг считаются на лету.
      operationId: getPlan
      security: [{session: []}]
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: План
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: 'Нет профессии или плана ещё не строили (`not_found`)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      tags: [plan]
      summary: Построить план (каждый вызов — новая версия, прежние сохраняются)
      description: |
        Строится алгоритмом без ИИ: навыки с уровнем ниже 1 по убыванию веса в вакансиях →
        их неизученные темы в порядке roadmap; для навыка «базово» — половина часов.
        Часы в неделю и дедлайн берутся из тела запроса, иначе из профиля (онбординга).
        Сейчас план доступен всем вошедшим; после запуска подписки — только подписчикам.
      operationId: buildPlan
      security: [{session: []}]
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hours_per_week: {type: integer, minimum: 2, maximum: 40}
                deadline: {type: [string, 'null'], format: date}
      responses:
        '201':
          description: План построен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        '400':
          description: 'Не указаны часы в неделю и их нет в профиле, или значения вне диапазона (`validation_error`)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /waitlist:
    post:
      tags: [catalog]
      summary: «Сообщить о запуске» профессии
      description: |
        Записывает почту в лист ожидания профессии. Повторная запись той же почты — без ошибки (204).
        Для вошедшего пользователя почту можно не передавать — возьмём из аккаунта.
      operationId: joinWaitlist
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profession_slug]
              properties:
                profession_slug: {type: string}
                email: {type: string, format: email}
      responses:
        '204':
          description: Записали
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}

  /admin/waitlist:
    get:
      tags: [admin]
      summary: Заявки «Сообщить о запуске»
      operationId: adminListWaitlist
      security: [{session: []}]
      parameters:
        - {name: profession_slug, in: query, schema: {type: string}}
      responses:
        '200':
          description: Заявки, новые сначала
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/WaitlistEntry'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/unknown-terms:
    get:
      tags: [admin]
      summary: Частые термины из вакансий, которых нет в справочнике навыков
      description: Наполняет collector. Разбор — PATCH со статусом.
      operationId: adminListUnknownTerms
      security: [{session: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [new, became_skill, became_synonym, ignored]}}
      responses:
        '200':
          description: Термины, частые сначала
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/UnknownTerm'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/unknown-terms/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    patch:
      tags: [admin]
      summary: Решение по термину
      description: |
        `became_skill` — создаётся новый навык со статусом new (дальше его проверяет команда);
        `became_synonym` — термин становится синонимом навыка `skill_id`; `ignored` — не навык.
      operationId: adminResolveUnknownTerm
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [became_skill, became_synonym, ignored, new]}
                skill_id: {type: integer, format: int64, description: 'Обязателен для became_synonym'}
      responses:
        '200':
          description: Готово
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UnknownTerm'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /admin/professions:
    get:
      tags: [admin]
      summary: Все профессии, включая скрытые
      operationId: adminListProfessions
      security: [{session: []}]
      responses:
        '200':
          description: Готово
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AdminProfession'}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
