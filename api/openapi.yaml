components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session

  headers:
    SessionCookie:
      description: '`session=<токен>; Path=/; HttpOnly; SameSite=Lax; Max-Age=2592000` (+ `Secure` вне локальной среды)'
      schema: {type: string}

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: {type: string, example: qa-manual}

  responses:
    ValidationError:
      description: 'Ошибка в данных (`validation_error`); в `fields` — что не так с каждым полем'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: validation_error
              message: Проверьте поля формы
              fields: {password: Пароль должен быть не короче 8 символов}
    Unauthorized:
      description: 'Пользователь не вошёл (`unauthorized`)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: 'Нет прав: нужна роль admin (`forbidden`)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: 'Конфликт: такой slug, название или синоним уже есть (`conflict`)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: 'Не найдено (`not_found`)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Машинный код ошибки
              examples: [validation_error, too_soon, completed, email_taken, invalid_credentials, too_many_attempts, too_many_requests, invalid_token, already_verified, unauthorized, forbidden, not_found, conflict, internal]
            message:
              type: string
              description: Текст для пользователя
            fields:
              type: object
              description: Ошибки по полям формы (только для validation_error)
              additionalProperties: {type: string}

    RegisterRequest:
      type: object
      required: [email, password, name, consent_pd]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 8, maxLength: 128}
        name: {type: string, minLength: 1, maxLength: 100}
        consent_pd:
          type: boolean
          description: Согласие на обработку персональных данных. Без true регистрация невозможна.
        consent_marketing:
          type: boolean
          default: false
          description: Согласие на рассылки (необязательное)

    TokenRequest:
      type: object
      required: [token]
      properties:
        token: {type: string, description: Токен из ссылки в письме}

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}

    User:
      type: object
      required: [id, email, name, role, email_verified]
      properties:
        id: {type: integer, format: int64}
        email: {type: string, format: email}
        name: {type: string}
        role: {type: string, enum: [user, admin]}
        email_verified: {type: boolean}

    ProfessionSummary:
      type: object
      required: [slug, title, status, blocks_count, topics_count]
      properties:
        slug: {type: string}
        title: {type: string}
        description: {type: [string, 'null']}
        for_whom: {type: [string, 'null']}
        status:
          type: string
          enum: [available, soon]
          description: available — можно открыть roadmap; soon — «скоро»
        blocks_count: {type: integer}
        topics_count: {type: integer}

    ProfessionDetail:
      type: object
      required: [slug, title, status, blocks, progress]
      properties:
        slug: {type: string}
        title: {type: string}
        description: {type: [string, 'null']}
        for_whom: {type: [string, 'null']}
        status: {type: string, enum: [available, soon]}
        progress:
          description: Прогресс вошедшего пользователя; null для гостя
          oneOf:
            - $ref: '#/components/schemas/Progress'
            - type: 'null'
        blocks:
          type: array
          items: {$ref: '#/components/schemas/Block'}

    Progress:
      type: object
      required: [studied, total]
      properties:
        studied: {type: integer, description: Сколько тем профессии изучено}
        total: {type: integer, description: Сколько тем в профессии}

    Block:
      type: object
      required: [id, title, topics]
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        topics:
          type: array
          items: {$ref: '#/components/schemas/Topic'}

    Topic:
      type: object
      required: [id, slug, title, hours, optional, studied, resources]
      properties:
        id: {type: integer, format: int64}
        slug: {type: string}
        title: {type: string}
        description: {type: [string, 'null']}
        hours: {type: number, description: Часы на изучение с нуля}
        optional: {type: boolean, description: Необязательна для junior}
        studied: {type: boolean}
        resources:
          type: array
          items: {$ref: '#/components/schemas/Resource'}

    Resource:
      type: object
      required: [id, title, url, type, language, is_free]
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        url: {type: string, format: uri}
        type: {type: string, enum: [article, video, course, docs, practice]}
        language: {type: string, examples: [ru, en]}
        is_free: {type: boolean}

    Match:
      type: object
      required: [percent, snapshot, key_skills_total, key_skills_covered, missing]
      properties:
        percent:
          type: [number, 'null']
          description: 0–100, одна цифра после запятой; null, если снимка весов нет
        snapshot:
          oneOf:
            - $ref: '#/components/schemas/Snapshot'
            - type: 'null'
        key_skills_total: {type: integer, description: Ключевых навыков профессии с весом в снимке}
        key_skills_covered: {type: integer, description: Из них с уровнем 1}
        missing:
          type: array
          description: Топ-5 недостающих навыков (уровень < 1) по убыванию веса
          maxItems: 5
          items: {$ref: '#/components/schemas/MissingSkill'}

    Snapshot:
      type: object
      required: [period, vacancy_count, calculated_at, preliminary]
      properties:
        period: {type: string, format: date}
        vacancy_count: {type: integer}
        calculated_at: {type: string, format: date-time}
        preliminary:
          type: boolean
          description: true, если вакансий меньше 200 — показывать пометку «предварительные данные»

    MissingSkill:
      type: object
      required: [skill_id, name, weight, level, topics]
      properties:
        skill_id: {type: integer, format: int64}
        name: {type: string}
        weight:
          type: number
          description: 'Доля вакансий с навыком, 0–1 (0.64 → «нужен в 64% вакансий»)'
        level: {type: number, enum: [0, 0.5]}
        topics:
          type: array
          description: Темы профессии, которые закрывают навык
          items:
            type: object
            required: [id, slug, title, studied]
            properties:
              id: {type: integer, format: int64}
              slug: {type: string}
              title: {type: string}
              studied: {type: boolean}

    IdList:
      type: object
      required: [ids]
      properties:
        ids: {type: array, items: {type: integer, format: int64}}

    AdminProfession:
      allOf:
        - $ref: '#/components/schemas/AdminProfessionInput'
        - type: object
          required: [id, slug, title, status, sort_order]
          properties:
            id: {type: integer, format: int64}
    AdminProfessionInput:
      type: object
      properties:
        slug: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        title: {type: string}
        description: {type: [string, 'null']}
        for_whom: {type: [string, 'null']}
        status: {type: string, enum: [available, soon, hidden]}
        sort_order: {type: integer}

    AdminBlock:
      type: object
      required: [id, title, sort_order, topics]
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        sort_order: {type: integer}
        topics:
          type: array
          items:
            type: object
            required: [id, slug, title, optional]
            properties:
              id: {type: integer, format: int64}
              slug: {type: string}
              title: {type: string}
              optional: {type: boolean}
    AdminBlockInput:
      type: object
      properties:
        title: {type: string}
        sort_order: {type: integer}
    AdminBlockTopicInput:
      type: object
      required: [topic_id]
      properties:
        topic_id: {type: integer, format: int64}
        optional: {type: boolean, default: false, description: Не обязательна для junior}

    AdminProfessionSkill:
      type: object
      required: [skill_id, is_key]
      properties:
        skill_id: {type: integer, format: int64}
        name: {type: string, readOnly: true}
        is_key: {type: boolean, description: Ключевой — участвует в оценке и % соответствия}

    AdminTopic:
      type: object
      required: [id, slug, title, hours, skill_ids, resource_ids]
      properties:
        id: {type: integer, format: int64}
        slug: {type: string}
        title: {type: string}
        description: {type: [string, 'null']}
        hours: {type: number}
        skill_ids: {type: array, items: {type: integer, format: int64}}
        resource_ids: {type: array, items: {type: integer, format: int64}}
    AdminTopicInput:
      type: object
      properties:
        slug: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', description: Только при создании}
        title: {type: string}
        description: {type: [string, 'null']}
        hours: {type: number, minimum: 0}

    AdminSkill:
      type: object
      required: [id, name, status, source, synonyms]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        status: {type: string, enum: [new, in_review, verified]}
        source: {type: string, enum: [vacancies, manual]}
        review_comment: {type: [string, 'null']}
        reviewed_at: {type: [string, 'null'], format: date-time}
        synonyms: {type: array, items: {$ref: '#/components/schemas/Synonym'}}
    AdminSkillInput:
      type: object
      properties:
        name: {type: string}
        status: {type: string, enum: [new, in_review, verified]}
        review_comment: {type: [string, 'null']}
    Synonym:
      type: object
      required: [id, synonym]
      properties:
        id: {type: integer, format: int64}
        synonym: {type: string}
    SynonymInput:
      type: object
      required: [synonym]
      properties:
        synonym: {type: string}

    AdminResource:
      type: object
      required: [id, title, url, type, language, is_free, status]
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        url: {type: string, format: uri}
        type: {type: string, enum: [article, video, course, docs, practice]}
        language: {type: string}
        is_free: {type: boolean}
        status: {type: string, enum: [ai_suggested, approved, rejected, replaced]}
        replaced_by_id: {type: [integer, 'null'], format: int64}
        review_comment: {type: [string, 'null']}
        reviewed_at: {type: [string, 'null'], format: date-time}
    AdminResourceInput:
      type: object
      properties:
        title: {type: string}
        url: {type: string, format: uri}
        type: {type: string, enum: [article, video, course, docs, practice]}
        language: {type: string}
        is_free: {type: boolean}
        status: {type: string, enum: [ai_suggested, approved, rejected, replaced]}
        replaced_by_id: {type: [integer, 'null'], format: int64, description: 'Для status = replaced — материал на замену'}
        review_comment: {type: [string, 'null']}

    Profile:
      type: object
      required: [learner_status, course, hours_per_week, deadline, months_learning, learned_unneeded, onboarding_completed]
      properties:
        learner_status: {type: [string, 'null'], enum: [student, graduate, switcher, other, null]}
        course: {type: [integer, 'null'], description: 'Курс, если студент'}
        hours_per_week: {type: [integer, 'null'], minimum: 2, maximum: 40}
        deadline: {type: [string, 'null'], format: date, description: Когда хочет найти работу}
        months_learning: {type: [integer, 'null'], description: Сколько месяцев уже учится}
        learned_unneeded: {type: [boolean, 'null'], description: 'Было ли, что учил лишнее'}
        onboarding_completed: {type: boolean}
    ProfileInput:
      type: object
      properties:
        learner_status: {type: [string, 'null'], enum: [student, graduate, switcher, other, null]}
        course: {type: [integer, 'null'], minimum: 1, maximum: 6}
        hours_per_week: {type: [integer, 'null'], minimum: 2, maximum: 40}
        deadline: {type: [string, 'null'], format: date}
        months_learning: {type: [integer, 'null'], minimum: 0, maximum: 240}
        learned_unneeded: {type: [boolean, 'null']}
        complete_onboarding: {type: boolean}

    Assessment:
      type: object
      required: [id, profession_slug, status, started_at, completed_at, skills]
      properties:
        id: {type: integer, format: int64}
        profession_slug: {type: string}
        status: {type: string, enum: [in_progress, completed]}
        started_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        skills:
          type: array
          description: Ключевые навыки профессии по убыванию веса в вакансиях
          items: {$ref: '#/components/schemas/AssessmentSkill'}
    AssessmentSkill:
      type: object
      required: [skill_id, name, question, answer]
      properties:
        skill_id: {type: integer, format: int64}
        name: {type: string}
        question:
          description: Проверочный вопрос для «уверенно»; null — вопроса пока нет (тогда «уверенно» засчитывается как 0,5)
          oneOf:
            - type: object
              required: [id, text, options]
              properties:
                id: {type: integer, format: int64}
                text: {type: string}
                options: {type: array, items: {type: string}}
            - type: 'null'
        answer:
          oneOf:
            - $ref: '#/components/schemas/Answer'
            - type: 'null'
    Answer:
      type: object
      required: [self_level, level, check_passed]
      properties:
        self_level: {type: string, enum: [none, basic, confident]}
        level: {type: number, enum: [0, 0.5, 1]}
        check_passed: {type: [boolean, 'null'], description: Результат проверочного вопроса (только для «уверенно»)}
    AnswerInput:
      type: object
      required: [self_level]
      properties:
        self_level: {type: string, enum: [none, basic, confident], description: Не знаю / базово / уверенно}
        check_option: {type: integer, minimum: 0, description: Номер выбранного варианта проверочного вопроса}

    Report:
      type: object
      required: [percent, snapshot, assessment, counts, top_gaps]
      properties:
        percent: {type: [number, 'null'], description: '0–100; null, если снимка весов нет'}
        snapshot:
          oneOf:
            - $ref: '#/components/schemas/Snapshot'
            - type: 'null'
        assessment:
          description: Последняя завершённая оценка по профессии; null — оценки не было (уровни только из «Изучено»)
          oneOf:
            - type: object
              required: [id, completed_at]
              properties:
                id: {type: integer, format: int64}
                completed_at: {type: string, format: date-time}
            - type: 'null'
        counts:
          type: object
          required: [have, partial, missing]
          properties:
            have: {type: integer, description: Уровень 1}
            partial: {type: integer, description: 'Уровень 0,5'}
            missing: {type: integer, description: Уровень 0}
        top_gaps:
          type: array
          maxItems: 3
          description: Три пробела с самым большим весом
          items: {$ref: '#/components/schemas/MissingSkill'}

    Plan:
      type: object
      required: [id, profession_slug, version_no, built_by, created_at, hours_per_week, deadline, total_hours,
                 ready_date, late, hours_per_week_needed, match_before, match_after, progress, current_item_id, items]
      properties:
        id: {type: integer, format: int64}
        profession_slug: {type: string}
        version_no: {type: integer, description: 'Номер версии плана: 1, 2, …'}
        built_by: {type: string, enum: [algorithm, ai]}
        created_at: {type: string, format: date-time}
        hours_per_week: {type: integer}
        deadline: {type: [string, 'null'], format: date}
        total_hours: {type: number, description: Сколько часов учиться по плану}
        ready_date: {type: string, format: date, description: Ожидаемая дата готовности}
        late: {type: boolean, description: Не успевает к дедлайну}
        hours_per_week_needed: {type: [integer, 'null'], description: 'Сколько часов в неделю нужно, чтобы успеть к дедлайну (если late)'}
        match_before: {type: [number, 'null'], description: '% соответствия сейчас (null — нет весов)'}
        match_after: {type: [number, 'null'], description: '% соответствия после плана'}
        progress:
          type: object
          required: [studied_hours, total_hours, percent]
          properties:
            studied_hours: {type: number}
            total_hours: {type: number}
            percent: {type: integer, description: Изученные часы / все часы плана}
        current_item_id: {type: [integer, 'null'], format: int64, description: 'Текущий шаг: первая неизученная тема'}
        items:
          type: array
          items: {$ref: '#/components/schemas/PlanItem'}
    PlanItem:
      type: object
      required: [id, sort_order, topic, hours, week_no, status, studied, skills]
      properties:
        id: {type: integer, format: int64}
        sort_order: {type: integer}
        topic:
          type: object
          required: [id, slug, title]
          properties:
            id: {type: integer, format: int64}
            slug: {type: string}
            title: {type: string}
        hours: {type: number}
        week_no: {type: integer, description: 'Неделя плана, в которую попадает тема'}
        status: {type: string, enum: [to_learn, optional], description: 'optional — тема не обязательна для junior'}
        studied: {type: boolean, description: Отмечена «Изучено» после построения плана}
        skills: {type: array, items: {type: string}, description: Какие недостающие навыки закрывает}

    WaitlistEntry:
      type: object
      required: [id, profession_slug, email, created_at]
      properties:
        id: {type: integer, format: int64}
        profession_slug: {type: string}
        email: {type: string, format: email}
        user_id: {type: [integer, 'null'], format: int64}
        created_at: {type: string, format: date-time}
    UnknownTerm:
      type: object
      required: [id, term, occurrences, status, first_seen_at, last_seen_at]
      properties:
        id: {type: integer, format: int64}
        term: {type: string}
        occurrences: {type: integer, description: В скольких вакансиях встречается}
        status: {type: string, enum: [new, became_skill, became_synonym, ignored]}
        skill_id: {type: [integer, 'null'], format: int64}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
