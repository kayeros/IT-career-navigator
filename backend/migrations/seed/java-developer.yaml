# ЧЕРНОВИК. Правит Рустам (темы, навыки) и Алик (материалы).
slug: java-developer
title: Java-разработчик
description: "Пишет серверную часть больших систем на Java и Spring: банки, маркетплейсы, корпоративные сервисы."
for_whom: Тем, кто готов к более строгому языку и хочет работать над крупными проектами.
sort_order: 3

key_skills:
  - Java
  - ООП
  - Java Collections
  - Stream API
  - Многопоточность
  - Git
  - Linux
  - Maven
  - Gradle
  - JUnit
  - Mockito
  - SQL
  - PostgreSQL
